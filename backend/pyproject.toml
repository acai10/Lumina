[project]
name = "lumina-backend"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "h5py>=3.10.0",
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "scikit-image>=0.24.0",
    "SimpleITK>=2.4.0",
]

[project.optional-dependencies]
elastix = [
    "itk-elastix>=0.20.0",
]
bm3d = [
    "bm3d>=4.0.0",
]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
