services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      # Host directory with source .h5 files, mounted read-only so originals can
      # never be modified. Set LUMINA_DATA_DIR in a .env file next to this compose
      # file (copy .env.example → .env); Compose loads it automatically on every
      # platform. Defaults to ./data so `docker compose up` still works without it.
      - ${LUMINA_DATA_DIR:-./data}:/data:ro
    environment:
      - PYTHONUNBUFFERED=1
      - CORS_ORIGINS=http://localhost:5173
      # Backend reads registerable source volumes from here (see GET /volumes/local).
      - DATA_DIR=/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
